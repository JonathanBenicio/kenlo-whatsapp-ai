name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Executar testes em container
        run: docker run --rm -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0.404 dotnet test backend/tests/Kenlo.Api.Tests.csproj --configuration Release
      - name: Construir imagem
        run: docker build -t kenlo-api:test ./backend

  frontend:
    name: Painel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar, testar e compilar em container
        run: docker run --rm -v "$PWD/frontend:/app" -w /app node:24.13.1-alpine sh -c 'npm ci && npm run test && npm run build'
      - name: Construir imagem
        run: docker build -t kenlo-painel:test ./frontend

  database:
    name: Migrações e regras de acesso
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: kenlo_test
        options: >-
          --health-cmd "pg_isready -U postgres -d kenlo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Aplicar migrações e validar dados fictícios
        run: |
          db='${{ job.services.postgres.id }}'
          docker exec "$db" psql -U postgres -d kenlo_test -v ON_ERROR_STOP=1 -c \
            'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;'
          for migration in supabase/migrations/*.sql; do
            docker exec -i "$db" psql -U postgres -d kenlo_test -v ON_ERROR_STOP=1 < "$migration"
          done
          for run in 1 2; do
            docker exec -i "$db" psql -U postgres -d kenlo_test -v ON_ERROR_STOP=1 < supabase/seed.demo.sql
            docker exec -i "$db" psql -U postgres -d kenlo_test -v ON_ERROR_STOP=1 < supabase/tests/database.sql
          done

  config:
    name: Configuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose config --quiet
      - run: python -m json.tool n8n/workflows/conversa-simulada.json > /dev/null

  compose:
    name: Ambiente integrado de demonstração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Iniciar containers locais
        run: docker compose up --build --wait --wait-timeout 240
      - name: Verificar demonstração
        run: python3 scripts/compose-smoke.py
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Encerrar containers de teste
        if: always()
        run: docker compose down --volumes
